{% extends 'core/base.html' %}
{% block title %}Create League — MatchDay{% endblock %}
{% block content %}
<style>
  .league-auth-wrap { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
  .league-auth-card { background: #161b22; border: 1px solid #30363d; padding: 3rem; border-radius: 20px; width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
  .league-auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #238636; }
  
  .league-title { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 8px; text-align: center; }
  .league-subtitle { color: #8b949e; font-size: 14px; text-align: center; margin-bottom: 2.5rem; font-weight: 500; }
  
  .league-form label { display: block; font-size: 11px; color: #8b949e; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .league-form input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 14px 18px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; box-sizing: border-box; margin-bottom: 2rem; }
  .league-form input:focus { border-color: #3fb950; box-shadow: 0 0 0 4px rgba(63,185,80,0.1); }
  
  .league-btn { width: 100%; background: #238636; color: #fff; font-weight: 800; font-size: 16px; border: none; border-radius: 10px; padding: 16px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
  .league-btn:hover { background: #2ea043; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(35, 134, 54, 0.3); }
</style>

<div class="league-auth-wrap">
  <div class="league-auth-card">
    <h2 class="league-title">Found a League</h2>
    <p class="league-subtitle">Invite colleagues and rivals to compete in your simulation.</p>
    
    <form method="post" class="league-form">
      {% csrf_token %}
      <div>
        <label for="name">League Designation</label>
        <input type="text" name="name" id="name" placeholder="e.g. Continental Pro Series" required autocomplete="off">
      </div>
      <button type="submit" class="league-btn">Initialize League</button>
    </form>
    
    <div style="text-align: center; margin-top: 2rem;">
        <a href="/leaderboard/" style="color: #8b949e; font-size: 13px; text-decoration: none; font-weight: 600;">&larr; Back to Global Center</a>
    </div>
  </div>
</div>
{% endblock %}
