{% extends 'core/base.html' %}
{% block title %}Login — MatchDay{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;" class="animate-in">
    <div class="glass-card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.8rem; font-weight: 900; color: #212529; margin-bottom: 0.5rem;">Welcome Back</h1>
            <p style="color: #6c757d; font-size: 0.9rem;">Sign in to your MatchDay account.</p>
        </div>

        {% if error %}
        <div style="background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 1.5rem; color: #f85149; font-size: 0.85rem; font-weight: 600;">
            ⚠ {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-input" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px; margin-top: 0.5rem;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; color: #6c757d; font-size: 0.85rem;">
            Don't have an account? <a href="{% url 'register' %}" style="color: #58a6ff; font-weight: 700;">Register</a>
        </div>
    </div>
</div>
{% endblock %}
