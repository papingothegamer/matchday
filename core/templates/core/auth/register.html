{% extends 'core/base.html' %}
{% block title %}Register — MatchDay{% endblock %}
{% block content %}
<style>
  .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
  .auth-card { background: #161b22; border: 1px solid #30363d; padding: 3.5rem; border-radius: 20px; width: 100%; max-width: 440px; box-shadow: 0 24px 64px rgba(0,0,0,0.6); position: relative; overflow: hidden; animation: authFadeIn 0.5s ease-out; }
  .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #238636, #3fb950, #238636); background-size: 200% 100%; animation: gradientMove 3s linear infinite; }
  @keyframes gradientMove { 0% { background-position: 100% 0%; } 100% { background-position: -100% 0%; } }
  @keyframes authFadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .auth-title { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 12px; text-align: center; letter-spacing: -1px; }
  .auth-subtitle { color: #8b949e; font-size: 15px; text-align: center; margin-bottom: 2.5rem; font-weight: 500; }
  
  .auth-form p { margin-bottom: 1.5rem; }
  .auth-form input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 14px 18px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; box-sizing: border-box; margin-top: 8px; font-weight: 500; }
  .auth-form input:focus { border-color: #3fb950; box-shadow: 0 0 0 4px rgba(63,185,80,0.1); background: #161b22; }
  .auth-form label { display: block; font-size: 12px; color: #8b949e; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  
  .auth-btn { width: 100%; background: #238636; color: #fff; font-weight: 800; font-size: 16px; border: none; border-radius: 10px; padding: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3); }
  .auth-btn:hover { background: #2ea043; transform: translateY(-2px); box-shadow: 0 6px 200px rgba(35, 134, 54, 0.4); }
  
  .auth-footer { text-align: center; margin-top: 2rem; font-size: 14px; color: #8b949e; font-weight: 500; }
  .auth-footer a { color: #3fb950; text-decoration: none; font-weight: 800; }
  .auth-footer a:hover { color: #fff; }
  
  .error-msg { color: #fff; font-size: 14px; margin-bottom: 1.5rem; text-align: center; padding: 12px; background: rgba(248,81,73,0.15); border-radius: 10px; border: 1px solid #f85149; font-weight: 700; }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2 class="auth-title">Draft Your Legacy</h2>
    <p class="auth-subtitle">Initialize your simulation credentials.</p>
    
    {% if error %}
    <div class="error-msg">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 5px;"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="auth-form">
      {% csrf_token %}
      <p>
        <label for="username">Chosen Manager ID</label>
        <input type="text" name="username" id="username" required autocomplete="username" placeholder="e.g. Guardiola_Sim">
      </p>
      <p>
        <label for="password">Access Key</label>
        <input type="password" name="password" id="password" required autocomplete="new-password">
      </p>
      <p>
        <label for="confirm">Verify Access Key</label>
        <input type="password" name="confirm" id="confirm" required autocomplete="new-password">
      </p>
      <button type="submit" class="auth-btn">Initialize Account</button>
    </form>
    
    <div class="auth-footer">
      Already a registered manager? <a href="/auth/login/">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
